<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Secret of Evermore translation viewer</title>
    <style>
    body {
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      font-family: sans-serif;
      height: 100vh;
      margin: 0;
    }
    #error {
      background: #8b1e1e;
      padding: 8px 16px;
      white-space: pre-wrap;
    }
    #error:empty {
      display: none;
    }
    #tabs {
      background: #2a2a2a;
      display: flex;
      gap: 4px;
      padding: 4px 16px;
    }
    #tabs button {
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 12px;
    }
    #tabs button.active {
      border-bottom-color: #9cc4ff;
      color: #9cc4ff;
    }
    #scroller {
      flex: 1;
      overflow-y: auto;
    }
    .list {
      margin-inline: auto;
      max-width: 1200px;
    }
    article {
      border-bottom: 1px solid #444;
      display: grid;
      gap: 4px 16px;
      grid-template-columns: 1fr 1fr;
      padding: 8px 16px;
    }
    article.changed {
      background: #2f3b4c;
    }
    .speaker {
      color: #9cc4ff;
      font-size: 14px;
    }
    .number {
      color: #888;
      font-size: 14px;
    }
    article.warning {
      border-left: 4px solid #e05050;
    }
    article.warning .number {
      color: #e05050;
    }
    #warnings {
      align-items: center;
      color: #e0a030;
      display: flex;
      font-size: 14px;
      gap: 4px;
      margin-left: auto;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    canvas.page {
      margin-bottom: 4px;
    }
    .raw {
      color: #999;
      font-size: 12px;
      margin: 4px 0 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    </style>
  </head>
  <body>
    <nav id="tabs">
      <button class="active" data-view="dialog">会話</button>
      <button data-view="fixed">固定テキスト</button>
      <span id="warnings">
        <span id="warning-count"></span>
        <button data-step="-1" title="前の警告（p）">▲</button>
        <button data-step="1" title="次の警告（n）">▼</button>
      </span>
    </nav>
    <div id="error"></div>
    <main id="scroller">
      <div class="list" id="dialog"></div>
      <div class="list" hidden id="fixed"></div>
    </main>
    <script src="/client.js" type="module"></script>
  </body>
</html>
